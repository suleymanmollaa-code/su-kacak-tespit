<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#F8FAFC" rx="20"/>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="16" font-weight="600" fill="#1E40AF">
    Susayar — Cihaz Montaj Görünümü
  </text>

  <!-- PIPE (horizontal) -->
  <rect x="40" y="168" width="520" height="44" rx="6" fill="url(#pipeGrad)" filter="url(#shadow)"/>
  <!-- pipe shine -->
  <rect x="40" y="172" width="520" height="8" rx="4" fill="white" opacity="0.4"/>
  <!-- pipe end caps -->
  <rect x="36" y="164" width="14" height="52" rx="4" fill="#64748B"/>
  <rect x="550" y="164" width="14" height="52" rx="4" fill="#64748B"/>

  <!-- Water flow arrow -->
  <text x="300" y="195" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="13" fill="#94A3B8" font-weight="500">
    ← su akışı →
  </text>

  <!-- SENSOR (on pipe) -->
  <rect x="268" y="152" width="64" height="76" rx="8"
    fill="url(#sensorGrad)" filter="url(#shadow)"/>
  <!-- sensor label -->
  <text x="300" y="178" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="9" font-weight="700" fill="white" letter-spacing="1">SENSÖR</text>
  <!-- sensor LED indicator -->
  <circle cx="300" cy="196" r="5" fill="#4ADE80"/>
  <circle cx="300" cy="196" r="3" fill="#86EFAC"/>
  <!-- sensor bottom connector into pipe -->
  <rect x="292" y="220" width="16" height="12" rx="2" fill="#1E3A8A"/>

  <!-- Cable from sensor to box -->
  <path d="M 300 152 L 300 128 L 380 128 L 380 100"
    stroke="#94A3B8" stroke-width="3" stroke-dasharray="6,3"
    fill="none" stroke-linecap="round"/>

  <!-- BOX -->
  <rect x="330" y="36" width="110" height="72" rx="10"
    fill="url(#boxGrad)" stroke="#93C5FD" stroke-width="2"
    filter="url(#shadow)"/>
  <!-- box top shine -->
  <rect x="334" y="40" width="102" height="10" rx="5"
    fill="white" opacity="0.6"/>
  <!-- ESP32 chip inside box (visual) -->
  <rect x="345" y="56" width="42" height="28" rx="4" fill="#1E40AF" opacity="0.8"/>
  <text x="366" y="74" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="8" font-weight="700" fill="white">ESP32</text>
  <!-- WiFi symbol in box -->
  <g transform="translate(398, 62)">
    <path d="M0 16 C4 12 8 10 12 10 C16 10 20 12 24 16" stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M4 20 C7 17 9.5 16 12 16 C14.5 16 17 17 20 20" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="24" r="2.5" fill="#3B82F6"/>
  </g>
  <!-- Box label -->
  <text x="385" y="118" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" font-weight="700" fill="#1E40AF">ANA KUTU</text>
  <text x="385" y="130" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="8" fill="#64748B">10 × 7 × 4 cm</text>

  <!-- WIFI signal waves (from box upward) -->
  <g transform="translate(385, 36)" opacity="0.6">
    <path d="M-18 -8 C-10 -20 10 -20 18 -8" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-26 -16 C-14 -34 14 -34 26 -16" stroke="#3B82F6" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-34 -24 C-18 -48 18 -48 34 -24" stroke="#3B82F6" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Phone (notification) -->
  <rect x="468" y="36" width="52" height="88" rx="8"
    fill="#1E293B" filter="url(#shadow)"/>
  <rect x="472" y="44" width="44" height="68" rx="4" fill="#0F172A"/>
  <!-- screen content -->
  <rect x="476" y="50" width="36" height="5" rx="2" fill="#EF4444"/>
  <text x="494" y="56" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="5" font-weight="700" fill="white">ALARM!</text>
  <rect x="476" y="60" width="28" height="3" rx="1" fill="#334155"/>
  <rect x="476" y="66" width="22" height="3" rx="1" fill="#334155"/>
  <rect x="476" y="72" width="25" height="3" rx="1" fill="#334155"/>
  <!-- notification badge -->
  <circle cx="516" cy="46" r="7" fill="#EF4444"/>
  <text x="516" y="49" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="8" font-weight="700" fill="white">!</text>
  <!-- phone home button -->
  <circle cx="494" cy="118" r="4" fill="#334155"/>
  <!-- phone label -->
  <text x="494" y="138" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="9" font-weight="600" fill="#1E40AF">SMS / BİLDİRİM</text>
  <text x="494" y="150" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="8" fill="#64748B">5-10 saniye</text>

  <!-- Arrow from box to phone -->
  <path d="M 442 72 L 464 72"
    stroke="#3B82F6" stroke-width="2" fill="none"
    marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Dimension labels -->
  <!-- Pipe dimension -->
  <line x1="40" y1="230" x2="40" y2="248" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="560" y1="230" x2="560" y2="248" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="40" y1="240" x2="560" y2="240" stroke="#CBD5E1" stroke-width="1"/>
  <text x="300" y="260" text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#94A3B8">Standart boru hattı (DN15-DN50)</text>

  <!-- Legend -->
  <rect x="40" y="290" width="520" height="90" rx="10"
    fill="white" stroke="#E2E8F0" stroke-width="1"/>

  <text x="60" y="314" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="11" font-weight="700" fill="#1E40AF">Teknik Özellikler</text>

  <!-- Legend items -->
  <circle cx="60" cy="334" r="4" fill="#4ADE80"/>
  <text x="72" y="338" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#475569">Sensör: YF-S201 akış + basınç</text>

  <circle cx="60" cy="354" r="4" fill="#3B82F6"/>
  <text x="72" y="358" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#475569">İşlemci: ESP32 (WiFi dahili)</text>

  <circle cx="220" cy="334" r="4" fill="#F59E0B"/>
  <text x="232" y="338" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#475569">Kutu: IP67 su geçirmez</text>

  <circle cx="220" cy="354" r="4" fill="#8B5CF6"/>
  <text x="232" y="358" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#475569">Güç: Pil (6-12 ay) veya adaptör</text>

  <circle cx="400" cy="334" r="4" fill="#EF4444"/>
  <text x="412" y="338" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#475569">Alarm: SMS + uygulama bildirimi</text>

  <circle cx="400" cy="354" r="4" fill="#10B981"/>
  <text x="412" y="358" font-family="Helvetica Neue, Arial, sans-serif"
    font-size="10" fill="#475569">Kurulum: 15 dakika, usta gerekmez</text>
</svg>
