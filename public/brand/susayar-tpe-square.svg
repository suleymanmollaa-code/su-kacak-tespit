    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="106"
    font-weight="800">
    <tspan fill="#1E3A8A">Su</tspan><tspan fill="#1E3A8A" dx="20"> </tspan><tspan fill="#3B82F6">Sayar</tspan>
  </text>

</svg>
