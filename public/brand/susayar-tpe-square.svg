<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 591 591" width="591" height="591">

  <!-- White background -->
  <rect width="591" height="591" fill="#FFFFFF"/>

  <!-- Drop shape — daha simetrik, sivri uç yukarıda -->
  <path d="M295 70
    C295 70 205 185 205 255
    C205 310 247 355 295 355
    C343 355 385 310 385 255
    C385 185 295 70 295 70 Z"
    fill="#3B82F6"/>

  <!-- Smile — damlanın ortasında -->
